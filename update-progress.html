<script>
    document.addEventListener('DOMContentLoaded', () => {
        const role = localStorage.getItem('userRole');
        const selectTahap = document.getElementById('tahap');
        const inputManual = ['customer', 'project_name', 'quantity', 'varian'];

        if (role !== 'superadmin') {
            // Jika bukan superadmin, kunci semua input manual
            inputManual.forEach(id => document.getElementById(id).disabled = true);
            
            // Paksa pilih tahap sesuai role
            selectTahap.value = role;
            for (let i = 0; i < selectTahap.options.length; i++) {
                if (selectTahap.options[i].value !== role) {
                    selectTahap.options[i].disabled = true;
                }
            }
        }
    });

    async function simpan() {
        // ... kode fetch tetap sama seperti sebelumnya ...
    }
</script>
