<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Update Progress</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <h2 class="text-xl font-bold mb-6 text-center">Update Data Produksi</h2>
        <div class="space-y-4">
            <input id="no_order" type="text" placeholder="NO. SO (Wajib)" class="w-full p-2 border rounded font-bold">
            <div class="grid grid-cols-2 gap-2">
                <input id="customer" type="text" placeholder="Customer" class="manual-input w-full p-2 border rounded text-sm bg-gray-50">
                <input id="project_name" type="text" placeholder="Project" class="manual-input w-full p-2 border rounded text-sm bg-gray-50">
            </div>
            <div class="grid grid-cols-2 gap-2">
                <input id="quantity" type="text" placeholder="Qty" class="manual-input w-full p-2 border rounded text-sm bg-gray-50">
                <input id="varian" type="text" placeholder="Varian (KVA)" class="manual-input w-full p-2 border rounded text-sm bg-gray-50">
            </div>
            <hr>
            <select id="tahap" class="w-full p-2 border rounded">
                <option value="">-- Pilih Tahap --</option>
                <option value="design_approval">Design Approval</option>
                <option value="tank_making">Tank Making</option>
                <option value="core_making">Core Making</option>
                <option value="coil_making">Coil Making</option>
                <option value="core_coil_assy">Core Coil Assy</option>
                <option value="connection">Connection</option>
                <option value="final_assy">Final Assy</option>
                <option value="internal_test">Internal Test</option>
                <option value="finishing">Finishing</option>
            </select>
            <select id="status" class="w-full p-2 border rounded">
                <option value="Pending (Merah)">Pending (Merah)</option>
                <option value="In Progress (Kuning)">In Progress (Kuning)</option>
                <option value="Selesai (Hijau)">Selesai (Hijau)</option>
            </select>
            <button onclick="simpan()" class="w-full bg-green-600 text-white p-3 rounded font-bold">Simpan</button>
            <button onclick="location.href='login.html'" class="w-full text-gray-500 text-sm">Kembali</button>
        </div>
    </div>
    <script>
        const role = localStorage.getItem('userRole');
        document.addEventListener('DOMContentLoaded', () => {
            const isSuper = role === 'superadmin';
            const selectTahap = document.getElementById('tahap');
            if (!isSuper) {
                document.querySelectorAll('.manual-input').forEach(i => i.disabled = true);
                selectTahap.value = role;
                Array.from(selectTahap.options).forEach(opt => {
                    if (opt.value !== role && opt.value !== "") opt.disabled = true;
                });
            }
        });

        async function simpan() {
    const btn = document.getElementById('btnSimpan');
    const role = localStorage.getItem('userRole');
    
    // Siapkan data dasar
    const data = {
        no_order: document.getElementById('no_order').value,
        tahap: document.getElementById('tahap').value,
        status: document.getElementById('status').value
    };

    // Jika Superadmin, kirim juga data manualnya
    if (role === 'superadmin') {
        data.customer = document.getElementById('customer').value;
        data.project_name = document.getElementById('project_name').value;
        data.quantity = document.getElementById('quantity').value;
        data.varian = document.getElementById('varian').value;
    }

    if (!data.no_order) return alert("Isi NO. SO!");

    btn.innerText = "Menyimpan...";
    btn.disabled = true;

    try {
        const res = await fetch('/api/update-progress', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        if (res.ok) {
            alert("Berhasil!");
            location.href = 'login.html';
        }
    } catch (e) {
        alert("Error!");
    } finally {
        btn.innerText = "Simpan";
        btn.disabled = false;
    }
}
