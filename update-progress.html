<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Progress Produksi - Weltraf</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <h2 class="text-xl font-bold mb-6 text-center text-gray-800">Update Data Produksi</h2>
        
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">NOMOR SO / ORDER</label>
                <input id="no_order" type="text" placeholder="Contoh: 26-079" class="w-full p-3 border rounded-lg font-bold uppercase focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div id="identitas-section" class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">CUSTOMER</label>
                    <input id="customer" type="text" placeholder="Nama Customer" class="manual-input w-full p-2 border rounded text-sm bg-gray-50">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">PROJECT</label>
                    <input id="project_name" type="text" placeholder="Nama Project" class="manual-input w-full p-2 border rounded text-sm bg-gray-50">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">QUANTITY</label>
                    <input id="quantity" type="text" placeholder="Qty" class="manual-input w-full p-2 border rounded text-sm bg-gray-50">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">VARIAN (KVA)</label>
                    <input id="varian" type="text" placeholder="KVA" class="manual-input w-full p-2 border rounded text-sm bg-gray-50">
                </div>
            </div>

            <hr class="my-4">

            <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">TAHAP PRODUKSI</label>
                <select id="tahap" class="w-full p-3 border rounded-lg bg-white outline-none">
                    <option value="">-- Pilih Tahap --</option>
                    <option value="design_approval">Design Approval</option>
                    <option value="tank_making">Tank Making</option>
                    <option value="core_making">Core Making</option>
                    <option value="coil_making">Coil Making</option>
                    <option value="core_coil_assy">Core Coil Assy</option>
                    <option value="connection">Connection</option>
                    <option value="final_assy">Final Assy</option>
                    <option value="internal_test">Internal Test</option>
                    <option value="finishing">Finishing</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">STATUS PROGRESS</label>
                <select id="status" class="w-full p-3 border rounded-lg bg-white outline-none">
                    <option value="Pending (Merah)">🔴 Pending (Merah)</option>
                    <option value="In Progress (Kuning)">🟡 In Progress (Kuning)</option>
                    <option value="Selesai (Hijau)">🟢 Selesai (Hijau)</option>
                </select>
            </div>

            <button onclick="simpanData()" id="btnSimpan" class="w-full bg-green-600 hover:bg-green-700 text-white p-3 rounded-lg font-bold transition-all shadow-md">
                Simpan Perubahan
            </button>
            
            <button onclick="window.location.href='login.html'" class="w-full text-gray-500 text-sm font-medium hover:underline">
                Kembali ke Dashboard
            </button>
        </div>
    </div>

    <script>
        // Cek Login & Role
        const role = localStorage.getItem('userRole');
        
        document.addEventListener('DOMContentLoaded', () => {
            if (!role) {
                alert("Sesi habis, silakan login kembali.");
                window.location.href = 'index.html';
                return;
            }

            const isSuper = role === 'superadmin';
            const selectTahap = document.getElementById('tahap');
            
            // Proteksi Input jika bukan Superadmin
            if (!isSuper) {
                document.querySelectorAll('.manual-input').forEach(input => {
                    input.disabled = true;
                    input.classList.add('bg-gray-200', 'cursor-not-allowed');
                });
                
                // Kunci tahap sesuai role admin
                if (role !== "superadmin") {
                    selectTahap.value = role;
                    Array.from(selectTahap.options).forEach(opt => {
                        if (opt.value !== role && opt.value !== "") opt.disabled = true;
                    });
                }
            }
        });

        async function simpanData() {
            const btn = document.getElementById('btnSimpan');
            const noOrder = document.getElementById('no_order').value.trim();
            
            if (!noOrder) {
                alert("Nomor SO/Order wajib diisi!");
                return;
            }

            // Siapkan Data untuk dikirim
            const payload = {
                no_order: noOrder,
                tahap: document.getElementById('tahap').value,
                status: document.getElementById('status').value
            };

            // Tambahkan data identitas hanya jika diisi (biasanya oleh Superadmin)
            if (role === 'superadmin') {
                const cust = document.getElementById('customer').value;
                const proj = document.getElementById('project_name').value;
                const qty = document.getElementById('quantity').value;
                const varKva = document.getElementById('varian').value;

                if (cust) payload.customer = cust;
                if (proj) payload.project_name = proj;
                if (qty) payload.quantity = qty;
                if (varKva) payload.varian = varKva;
            }

            btn.innerText = "Memproses...";
            btn.disabled = true;

            try {
                const response = await fetch('/api/update-progress', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert("Data berhasil diperbarui!");
                    window.location.href = 'login.html';
                } else {
                    const err = await response.json();
                    alert("Gagal menyimpan: " + (err.message
