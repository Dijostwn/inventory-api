<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login - Weltraf</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-xl w-96 text-center">
        <h2 class="text-xl font-bold mb-6">MONITORING PRODUKSI WELTRAF</h2>
        <input id="user" type="text" placeholder="Username" class="w-full p-3 border rounded mb-4">
        <input id="pass" type="password" placeholder="Password" class="w-full p-3 border rounded mb-6">
        <button onclick="doLogin()" id="btnLogin" class="w-full bg-blue-600 text-white p-3 rounded font-bold">Login</button>
    </div>
    <script>
        async function doLogin() {
            const user = document.getElementById('user').value;
            const pass = document.getElementById('pass').value;
            const res = await fetch('/auth-login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pass })
            });
            const result = await res.json();
            if (res.ok) { 
                localStorage.setItem('userRole', result.role);
                window.location.href = 'login.html'; 
            } else { alert("Login Gagal!"); }
        }
    </script>
</body>
</html>
